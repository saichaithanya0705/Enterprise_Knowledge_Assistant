services:
  # Free-tier demo: SQLite and Chroma live on Render's ephemeral filesystem.
  # Upgrade this service and restore the /var/data disk configuration before
  # treating accounts, conversations, or indexed documents as durable data.
  - type: web
    name: eka-api-saichaithanya0705
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./data/knowledge_assistant.db
      - key: CHROMA_PERSIST_DIR
        value: ./data/chroma
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: CORS_ORIGINS
        value: https://eka-web-saichaithanya0705.onrender.com
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 720
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_RERANK_URL
        value: https://integrate.api.nvidia.com/v1/ranking
      - key: NVIDIA_EMBEDDING_MODEL
        value: nvidia/nv-embedqa-e5-v5
      - key: NVIDIA_RERANK_MODEL
        value: nvidia/nv-rerankqa-mistral-4b-v3
      - key: NVIDIA_CHAT_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: BOOTSTRAP_ADMIN_NAME
        value: Administrator
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@example.com
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  - type: web
    name: eka-web-saichaithanya0705
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://eka-api-saichaithanya0705.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
